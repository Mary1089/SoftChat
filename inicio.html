<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SoftChat — Chats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f4f5;          /* fondo general (gris claro) */
      --surface: #ffffff;     /* tarjetas y buscador (blanco) */
      --accent: #2f2f33;      /* botones, badges, pestaña activa */
      --accent-dark: #111113;
      --text: #2b2b2e;
      --muted: #8d8d93;
      --line: #e4e4e7;
      --hover: #ececee;
      --new: #16a34a;         /* hora de mensajes nuevos y punto de notificación */
      --amber-bg: #e9f8e1;
      --amber-line: #bfe5b0;
      --amber-text: #2f6b1f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: "Nunito Sans", Arial, sans-serif; color: var(--text); background: var(--bg); }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .app { display: grid; grid-template-columns: 96px 440px 1fr; height: 100vh; }

    /* Navegación lateral */
    .nav { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 0; background: var(--surface); border-right: 1px solid var(--line); }
    .nav .logo { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-bottom: 18px; }
    .nav .logo img { width: 39px; height: 35px; object-fit: contain; }
    .nav-item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 68px; padding: 10px 0; border-radius: 18px; color: var(--muted); font-size: 11px; font-weight: 700; transition: background-color .15s; }
    .nav-item:hover { background: var(--hover); }
    .nav-item.active { background: var(--bg); color: var(--accent); }
    .nav-item svg { width: 26px; height: 26px; }
    .nav-badge { position: absolute; top: 4px; right: 10px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; }

    /* Lista de chats */
    .list { display: flex; flex-direction: column; min-height: 0; padding: 22px 20px 0; background: var(--bg); border-right: 1px solid var(--line); }
    .head { display: flex; align-items: center; gap: 12px; }
    .head .mark { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }
    .head h1 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -.04em; }
    .head .spacer { flex: 1; }
    .icon-btn { position: relative; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: #55555a; transition: background-color .15s; }
    .icon-btn:hover { background: var(--hover); }
    .icon-btn .dot { position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--new); }

    .search { position: relative; display: block; margin-top: 20px; }
    .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .search input { width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 16px; padding: 0 16px 0 44px; background: var(--surface); font-size: 15px; outline: none; }
    .search input::placeholder { color: var(--muted); }
    .search input:focus-visible { outline: 2px solid var(--accent); }

    .tabs { display: flex; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
    .tab { display: flex; align-items: center; gap: 6px; padding: 10px 12px; font-size: 14px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab .count { padding: 1px 7px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 800; }

    .assistant { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 10px 14px; border: 1px solid var(--amber-line); border-radius: 14px; background: var(--amber-bg); text-align: left; width: 100%; }
    .assistant .ico { width: 40px; height: 40px; border-radius: 10px; background: #bfe5b0; display: grid; place-items: center; color: var(--amber-text); flex: none; }
    .assistant b { display: block; font-size: 14px; color: var(--amber-text); }
    .assistant span { font-size: 13px; color: var(--amber-text); }

    .chats { flex: 1; min-height: 0; margin: 8px -20px 0; padding: 0 12px 24px; overflow-y: auto; list-style: none; }
    .chat { display: flex; gap: 14px; align-items: center; width: 100%; padding: 12px 10px; border-radius: 18px; text-align: left; transition: background-color .15s; }
    .chat:hover { background: var(--hover); }
    .chat.selected { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .avatar { position: relative; flex: none; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 22px; font-weight: 800; }
    .chat .body { flex: 1; min-width: 0; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .name { font-size: 17px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .time { flex: none; font-size: 13px; color: var(--muted); }
    .time.new { color: var(--new); font-weight: 700; }
    .tags { display: flex; gap: 6px; margin-top: 2px; }
    .tags span { padding: 0 6px; border-radius: 5px; background: #e4e4e7; color: #6b6b72; font-size: 11px; font-weight: 600; }
    .preview { margin-top: 3px; font-size: 14.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .unread { flex: none; min-width: 26px; height: 24px; padding: 0 8px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; }
    .unread.muted { background: #d4d4d8; color: #55555a; }
    .flag { position: absolute; top: -2px; right: -4px; font-size: 12px; color: #f59e0b; }
    .empty { padding: 32px 12px; text-align: center; color: var(--muted); }

    /* Panel derecho */
    .panel { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 32px; text-align: center; background: var(--surface); }
    .panel img { width: 78px; height: 70px; object-fit: contain; opacity: .9; }
    .panel h2 { margin: 6px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -.04em; }
    .panel p { margin: 0; max-width: 340px; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .fab { position: absolute; right: 32px; bottom: 32px; width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 24px rgba(0,0,0,.22); transition: background-color .15s; }
    .fab:hover { background: var(--accent-dark); }

    /* Tablet y móvil */
    @media (max-width: 1100px) { .app { grid-template-columns: 96px 1fr; } .panel { display: none; } }
    @media (max-width: 720px) {
      .app { display: flex; flex-direction: column-reverse; }
      .nav { flex-direction: row; justify-content: space-around; gap: 0; padding: 8px 12px; border-right: 0; border-top: 1px solid var(--line); }
      .nav .logo { display: none; }
      .list { flex: 1; border-right: 0; padding: 18px 16px 0; }
      .chats { margin: 8px -16px 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Principal">
      <a class="logo" href="#" aria-label="SoftChat"><img src="softchat-logo.png" alt=""></a>
      <button class="nav-item active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>
        Chats <span class="nav-badge">5</span>
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        Contactos
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-8-4.6-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5C20 15.4 12 20 12 20z"/></svg>
        Momentos
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        Perfil
      </button>
    </nav>

    <section class="list" aria-label="Lista de chats">
      <div class="head">
        <span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></span>
        <h1>Chats</h1>
        <span class="spacer"></span>
        <button class="icon-btn" aria-label="Estado de ánimo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1 1.2 2.1 1.8 3.5 1.8s2.5-.6 3.5-1.8M9 9.5h.01M15 9.5h.01"/></svg></button>
        <button class="icon-btn" aria-label="Notificaciones"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/></svg><span class="dot"></span></button>
        <button class="icon-btn" aria-label="Nuevo chat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>

      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Buscar chats..." aria-label="Buscar chats">
      </label>

      <div class="tabs" role="tablist" aria-label="Filtros">
        <button class="tab active" role="tab" data-filter="all">Todos</button>
        <button class="tab" role="tab" data-filter="fav">Favoritos</button>
        <button class="tab" role="tab" data-filter="unseen">No vistos <span class="count">3</span></button>
        <button class="tab" role="tab" data-filter="archived">Archivados</button>
      </div>

      <button class="assistant" type="button">
        <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 13.5c1 1.2 2.1 1.8 3.5 1.8s2.5-.6 3.5-1.8M9 9.5h.01M15 9.5h.01"/></svg></span>
        <span><b>Asistente IA · Calendario</b><span>2 recordatorios pendientes para hoy</span></span>
      </button>

      <ul class="chats" id="chats"></ul>
    </section>

    <section class="panel" aria-label="Conversación">
      <img src="softchat-logo.png" alt="">
      <h2>Selecciona un chat</h2>
      <p>Elige una conversación de la lista para ver los mensajes o inicia una nueva.</p>
      <button class="fab" aria-label="Nuevo mensaje"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
    </section>
  </div>

  <script>
    const icons = {
      monitor: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
      book: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2zM12 6v14"/></svg>'
    };
    const chats = [
      { name: 'Camilo', initials: icons.monitor, bg: 'linear-gradient(135deg,#5b5a7a,#8a7b94)', time: 'lun.', preview: '<span style="color:#16a34a">● </span>veamos una peli juntos 🎬', fav: true, unseen: true },
      { name: 'Programación Java', initials: 'RC', bg: 'linear-gradient(135deg,#1f7fc4,#2fa77a)', time: '2:08 PM', tags: ['# General', 'Cursos', 'Peticiones'], preview: 'Recursos Bot: H…', unread: 5, newer: true, unseen: true },
      { name: 'Recursos Académicos', initials: icons.book, bg: 'linear-gradient(135deg,#2e7d3f,#4caf50)', time: '2:05 PM', preview: 'Microsoft abre inscripciones…', unread: 5788, newer: true },
      { name: 'Comunidad Dev Colombia', initials: 'MB', bg: '#1c1c1c', time: '1:38 PM', preview: '★ Jazº ★: Buscar en el grupo…', unread: 17307, muted: true },
      { name: 'Proyecto Final Sistemas', initials: 'GC', bg: '#1b2a3d', time: '12:23 PM', preview: 'Nuevo recurso disponible…', unread: 926, muted: true, fav: true },
      { name: 'Grupo Sistemas TdeA', initials: 'TS', bg: '#0d0d1a', time: '11:40 AM', preview: 'Revisen el cronograma de entregas', muted: true, archived: true }
    ];
    let filter = 'all', query = '', selected = null;
    const list = document.getElementById('chats');
    const fmt = n => n.toLocaleString('es-CO');
    const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

    function render() {
      const q = query.trim().toLowerCase();
      const items = chats.filter(c =>
        (filter === 'all' ? !c.archived : filter === 'fav' ? c.fav : filter === 'unseen' ? c.unseen : c.archived) &&
        (!q || c.name.toLowerCase().includes(q) || c.preview.toLowerCase().includes(q)));
      list.innerHTML = items.length ? items.map(c => `
        <li><button class="chat ${selected === c.name ? 'selected' : ''}" data-name="${esc(c.name)}">
          <span class="avatar" style="background:${c.bg}">${c.initials}${c.fav ? '<span class="flag">★</span>' : ''}</span>
          <span class="body">
            <span class="row"><span class="name">${esc(c.name)}</span><span class="time ${c.newer ? 'new' : ''}">${c.time}</span></span>
            ${c.tags ? `<span class="tags">${c.tags.map(t => `<span>${esc(t)}</span>`).join('')}</span>` : ''}
            <span class="row"><span class="preview">${c.preview}</span>${c.unread ? `<span class="unread ${c.muted ? 'muted' : ''}">${fmt(c.unread)}</span>` : ''}</span>
          </span>
        </button></li>`).join('') : '<li class="empty">No hay chats para mostrar.</li>';
    }

    list.addEventListener('click', e => {
      const b = e.target.closest('.chat'); if (!b) return;
      selected = b.dataset.name; render();
    });
    document.getElementById('search').addEventListener('input', e => { query = e.target.value; render(); });
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
      filter = t.dataset.filter; render();
    }));
    render();
  </script>
</body>
</html>
